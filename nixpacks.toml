[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = ["...", "php83Extensions.pdo_mysql", "php83Extensions.fileinfo", "php83Extensions.gd", "php83Extensions.mbstring", "php83Extensions.curl", "php83Extensions.zip"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "php artisan storage:link || true"
]

[start]
cmd = "bash start.sh"
